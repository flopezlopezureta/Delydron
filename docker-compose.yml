services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dronecontrol
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: dronecontrol
    ports:
      - "5433:5432"
    volumes:
      - dronecontrol_db_data:/var/lib/postgresql/data

volumes:
  dronecontrol_db_data:
